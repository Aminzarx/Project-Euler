name: Build Android APK

on:
  push:
    branches:
      - claude/android-app-development-c0tw5d
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-app

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android-app
        env:
          APP_VERSION_CODE: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: "Latest debug build"
          body: "Automatically updated on every push. Commit: ${{ github.sha }}"
          make_latest: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
