name: Deploy Wedding Invitation to VPS

# Runs from GitHub's own runners (which have normal internet access) rather than any sandboxed
# agent session — this is the actual network hop that reaches the VPS. Deploys on every push to
# main or this feature branch that touches wedding/, and can always be re-run by hand from the
# Actions tab.
#
# Target: an isolated, unprivileged Docker container (no docker socket inside it) with a 1GB RAM
# cap — same box as deploy-backend.yml. The app runs as a plain Node process (`next start`) under
# pm2. Public HTTPS/routing is NOT handled by this workflow: the container has no way to bind a
# host-level port 80/443 or edit the real zarandix.ir vhost, so a reverse-proxy rule on the host
# (outside this workflow's reach) is what actually exposes the app at https://zarandix.ir/Wedding —
# see wedding/docs/README.md and hand the internal port below to whoever manages that.
on:
  push:
    branches: [main, claude/run-prompt-1ubxsy]
    paths:
      - "wedding/**"
      - ".github/workflows/deploy-wedding.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Internal port the app listens on inside the container — not published to the internet by
      # this workflow (see the file header). Change via the optional WEDDING_PORT repo variable if
      # it ever conflicts with something else already running in the container.
      APP_PORT: ${{ vars.WEDDING_PORT || 4100 }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SMS_PROVIDER_VALUE: ${{ vars.SMS_PROVIDER }}
          KAVENEGAR_API_KEY_SECRET: ${{ secrets.KAVENEGAR_API_KEY }}
          KAVENEGAR_SENDER_SECRET: ${{ secrets.KAVENEGAR_SENDER }}
          MELIPAYAMAK_USERNAME_SECRET: ${{ secrets.MELIPAYAMAK_USERNAME }}
          MELIPAYAMAK_PASSWORD_SECRET: ${{ secrets.MELIPAYAMAK_PASSWORD }}
          MELIPAYAMAK_SENDER_SECRET: ${{ secrets.MELIPAYAMAK_SENDER }}
          FARAZSMS_API_KEY_SECRET: ${{ secrets.FARAZSMS_API_KEY }}
          FARAZSMS_SENDER_SECRET: ${{ secrets.FARAZSMS_SENDER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: SMS_PROVIDER_VALUE,KAVENEGAR_API_KEY_SECRET,KAVENEGAR_SENDER_SECRET,MELIPAYAMAK_USERNAME_SECRET,MELIPAYAMAK_PASSWORD_SECRET,MELIPAYAMAK_SENDER_SECRET,FARAZSMS_API_KEY_SECRET,FARAZSMS_SENDER_SECRET
          command_timeout: 15m
          script_stop: true
          # Deliberately just single-line commands here, no multi-line if/fi or function
          # defs: appleboy/ssh-action's script_stop mode injects an exit-code check after
          # every newline, which fires on a false `if` test before `then`/`else` ever run.
          # All the real (and more complex) logic lives in wedding/scripts/deploy.sh instead,
          # which this just clones/updates and then executes as a single script.
          script: |
            APP_DIR="${VPS_APP_DIR:-$HOME/wedding-invitation}"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"
            mkdir -p "$APP_DIR"
            find "$APP_DIR/.git" -name '*.lock' -delete 2>/dev/null || true
            (cd "$APP_DIR" && git rev-parse --git-dir) >/dev/null 2>&1 || git clone --branch "$BRANCH" --depth 1 "$REPO_URL" "$APP_DIR"
            (cd "$APP_DIR" && git fetch --depth 1 origin "$BRANCH" && git reset --hard "origin/$BRANCH") || (rm -rf "$APP_DIR" && git clone --branch "$BRANCH" --depth 1 "$REPO_URL" "$APP_DIR")
            APP_PORT="${{ env.APP_PORT }}" bash "$APP_DIR/wedding/scripts/deploy.sh"

      - name: Health check
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sleep 5
            curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "http://127.0.0.1:${{ env.APP_PORT }}/Wedding" && \
              pm2 status wedding-invitation || \
              echo "Health check failed on the container's own loopback — check 'pm2 logs wedding-invitation' on the server."
